# Runs the offline test suite on every pull request and on main. No API key is needed.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/download_data.py  # pinned benchmark data, so tests that read it also run here
      - run: python -m pytest -q
